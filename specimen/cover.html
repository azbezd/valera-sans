<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valera Sans — авторские обложки</title>
<link rel="stylesheet" href="../fonts/web/valera-sans.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#11110f;color:#f4d437;font-family:Arial,sans-serif}main{width:1280px;height:640px;position:relative;overflow:hidden}.hand{font-family:'Valera Sans',sans-serif;font-kerning:normal;font-feature-settings:'calt' 1;font-synthesis:none;font-weight:400}p{margin:0}.kicker{position:absolute;left:48px;top:32px;font-size:19px;letter-spacing:.12em}.title{position:absolute;left:40px;top:88px;font-size:161px;line-height:1.05;z-index:2}.title span{display:block}.title span+span{margin-left:90px}.painting{position:absolute;right:52px;top:56px;width:365px;height:auto;transform:rotate(7deg)}.note{position:absolute;left:59px;top:445px;font-size:60px;transform:rotate(-4deg)}.footer{position:absolute;left:48px;bottom:34px;font-size:20px;color:#bcae74}.credit{position:absolute;right:40px;bottom:32px;font-size:18px;color:#bcae74}.flourish{position:absolute;left:646px;top:358px;width:106px;height:118px;transform:rotate(-10deg)}.features{display:none;gap:0}.poster{width:50%;height:640px;position:relative;overflow:hidden}.poster h2{font:400 94px/1.02 'Valera Sans',sans-serif;margin:0;position:absolute;z-index:2}.poster img{position:absolute;display:block;object-fit:contain}.poster .label{position:absolute;bottom:30px;left:34px;font-size:17px;line-height:1.5}.fruit{background:#f4d437;color:#11110f}.fruit h2{top:32px;left:34px;transform:rotate(-3deg)}.fruit img{width:490px;left:75px;top:232px;transform:rotate(4deg)}.fish{background:#11110f;color:#f4d437}.fish h2{top:389px;left:42px;transform:rotate(-4deg);font-size:82px}.fish img{width:490px;left:75px;top:30px;transform:rotate(-5deg)}.fish .label{color:#bcae74}.features:target{display:flex}.features:target~.cover{display:none}
</style></head><body>
<main id="examples" class="features" aria-label="Примеры Valera Sans с работами автора">
<article class="poster fruit"><h2>Краски,<br>бумага.</h2><img src="artworks/granat-i-mandariny.webp" alt="Гранат и мандарины — живопись Валерия Исаченкова"><p class="label">ГРАНАТ И МАНДАРИНЫ / МАСЛО</p></article>
<article class="poster fish"><img src="artworks/forel.webp" alt="Форель с розмарином и лимоном — графика Валерия Исаченкова"><h2>Вещи<br>вокруг.</h2><p class="label">Telegram · t.me/valerasketch</p></article>
</main>
<main class="cover" aria-label="Valera Sans — рукописный шрифт Валерия Исаченкова">
<p class="kicker">РУКОПИСНЫЙ ШРИФТ / ВАЛЕРИЙ ИСАЧЕНКОВ</p>
<img class="painting" src="artworks/molodost.webp" alt="Молодость — живопись Валерия Исаченкова">
<h1 class="title hand" style="margin:0"><span>Valera</span><span>Sans</span></h1>
<p class="note hand">Живые буквы.</p>
<svg class="flourish" viewBox="0 0 106 118" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M50 8 58 100M10 39 94 77M11 85 91 25"/></svg>
<p class="footer">Кириллица + латиница / 3 начертания</p><p class="credit">Telegram · t.me/valerasketch</p>
</main></body></html>
